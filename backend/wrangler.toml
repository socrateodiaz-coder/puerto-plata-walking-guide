name = "puerto-plata-guide-api"
main = "src/index.js"
compatibility_date = "2026-10-10"
workers_dev = true

# The test D1 database ID is configured. Create/configure the R2 bucket only
# after R2 access and usage-based billing are approved.
# Keep separate test and production resources. Production deployment is not
# implemented or enabled by this prototype; the Worker rejects non-test mode.
[[d1_databases]]
binding = "DB"
database_name = "puerto-plata-guide-test"
database_id = "c02ba1d3-bcc5-480a-ab76-4ef845ff11a5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "GUIDE_FILES"
bucket_name = "puerto-plata-guide-private-test"

[vars]
APP_ENV = "test"
PAYMENTS_ENABLED = "false"
SITE_ORIGIN = "https://socrateodiaz-coder.github.io/puerto-plata-walking-guide"
ALLOWED_ORIGINS = "https://socrateodiaz-coder.github.io"
PAYPAL_API_BASE = "https://api-m.sandbox.paypal.com"
